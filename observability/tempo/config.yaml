server:
  http_listen_port: 3200
  grpc_listen_port: 9095

# Directorio de datos persistente
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks

# Receptor: acepta trazas OTLP desde Grafana Alloy
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m     # Flushing periódico hacia storage
  trace_idle_period: 10s     # Tiempo de espera para spans tardíos

compactor:
  compaction:
    block_retention: 48h     # Retención de trazas: 48h en local (dev)

# Métricas internas de Tempo
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: local

# Query Frontend
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
