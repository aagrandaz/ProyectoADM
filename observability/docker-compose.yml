version: '3.8'

services:
  # ============================================================================
  # STACK DE OBSERVABILIDAD: LGTM (Loki + Grafana + Tempo + Mimir) + Alloy
  # ============================================================================
  # Grafana Alloy: Colector unificado OTel. Recibe trazas OTLP, logs y métricas.
  # Distribuye hacia: Tempo (trazas), Loki (logs), Mimir (métricas)
  alloy:
    image: grafana/alloy:v1.2.0
    container_name: nbp-alloy
    ports:
      - "4317:4317"    # OTLP gRPC (trazas desde aplicaciones)
      - "4318:4318"    # OTLP HTTP (alternativa)
      - "12345:12345"  # Alloy UI/API
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      # Montar la carpeta logs del proyecto para que Alloy la pueda leer
      - ../logs:/var/log/proyecto
      - alloy-data:/var/lib/alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    networks:
      - nbp-network
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:12345/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana Loki: Backend de almacenamiento de logs (recibe desde Alloy)
  loki:
    image: grafana/loki:3.0.0
    container_name: nbp-loki
    ports:
      - "3100:3100"  # Loki API/Push endpoint
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - nbp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana Tempo: Backend de almacenamiento de trazas distribuidas (recibe desde Alloy)
  tempo:
    image: grafana/tempo:2.5.0
    container_name: nbp-tempo
    ports:
      - "3200:3200"   # Tempo API
      - "9095:9095"   # Tempo gRPC
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    networks:
      - nbp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana Mimir: Backend de métricas long-term Prometheus-compatible (recibe desde Alloy)
  mimir:
    image: grafana/mimir:2.12.0
    container_name: nbp-mimir
    ports:
      - "9009:9009"  # Mimir API/Remote-write endpoint
    command: -config.file=/etc/mimir/config.yaml
    volumes:
      - ./mimir/config.yaml:/etc/mimir/config.yaml
      - mimir-data:/data/mimir
    networks:
      - nbp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9009/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana UI: Dashboard unificado para Logs (Loki), Trazas (Tempo), Métricas (Mimir)
  grafana:
    image: grafana/grafana:11.0.0
    container_name: nbp-grafana
    ports:
      - "3000:3000"  # Grafana Web UI
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor traceQLStreaming metricsSummary
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - nbp-network
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loki-data:
    driver: local
  tempo-data:
    driver: local
  mimir-data:
    driver: local
  grafana-data:
    driver: local
  alloy-data:
    driver: local

networks:
  nbp-network:
    name: nbp-network
    driver: bridge
