apiVersion: 1

providers:
  # Dashboards pre-construidos para el recomendador Next Best Product
  - name: next-best-product-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
